name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Android lisanslarini kabul et
        run: yes | sdkmanager --licenses || true
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - name: APK adini duzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk BriocheLab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BriocheLab-APK
          path: BriocheLab.apk
      - name: Surum sayfasina yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BriocheLab (en guncel)
          body: En guncel BriocheLab APK dosyasi. Kurulum icin BASLA.md dosyasina bakin.
          files: BriocheLab.apk

  testler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Android lisanslarini kabul et
        run: yes | sdkmanager --licenses || true
      - name: Birim testlerini calistir
        run: gradle testDebugUnitTest --no-daemon
      - name: Test raporunu kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/testDebugUnitTest
